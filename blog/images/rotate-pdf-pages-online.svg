<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">Rotate PDF pages illustration</title>
<desc id="desc">A sideways document rotates upright with a curved blue arrow on a dark navy background.</desc>
